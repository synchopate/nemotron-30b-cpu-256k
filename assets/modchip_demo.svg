    <text x="12" y="19" fill="#8b949e" font-size="10" font-weight="600" class="mono">⏱️ SLOT 0 / PREFILL</text>
    <text x="12" y="42" fill="#58a6ff" font-size="20" font-weight="700" class="mono">18.9 ms</text>
    <text x="12" y="58" fill="#8b949e" font-size="11" class="mono">Prefill: 241–306.8 tok/s</text>
  </g>

  <!-- Card 4: 256K KV & L3 Cache -->
