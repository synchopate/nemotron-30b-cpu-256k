    <text x="32" y="184" fill="#58a6ff" font-size="12.5" font-weight="700" class="mono">[1/2] Stage 1: Warm Agentic &lt;tool_call&gt; + C++20 Lock-Free Ring Buffer (22.3K Active Context)...</text>
    <text x="32" y="204" fill="#8b949e" font-size="12" class="mono">  ├─ Slot 0 Restored from /dev/shm/claude_40tools_slot0.bin (22,237 tokens) in 18.9 ms</text>
    <text x="32" y="222" fill="#3fb950" font-size="12.5" font-weight="700" class="mono">  └─ ⚡ 34.52 tok/s (2.45s total turn) │ TTFT: 412 ms │ ♟️ Stockfish-PVS: 35/42 (83.3% accepted, len 4.18)</text>
  </g>

  <!-- Stage 2 Output -->
  <g class="reveal2">
    <text x="32" y="254" fill="#bc8cff" font-size="12.5" font-weight="700" class="mono">[2/2] Stage 2: In-Context Code Refactoring — Stockfish-PVS (M=7) Singular Horizon Burst (25.4K Context)...</text>
    <text x="32" y="274" fill="#8b949e" font-size="12" class="mono">  ├─ Active Drafter: 8-Level FNV-64 Cascade + Online Session Trie + 11,382 Macro Codebook + 1.64MB Zobrist TT</text>
    <text x="32" y="292" fill="#e6edf3" font-size="12" class="mono">  ├─ Streaming: class HARPCacheEngine: def resolve_prefix(self, token_ids: List[int]) -&gt; Tuple[int, List[int]]: ...</text>
    <text x="32" y="310" fill="#3fb950" font-size="12.5" font-weight="700" class="mono">  └─ ⚡ 48.39 tok/s avg (Peak: 60.40 tok/s, 500 tok in 10.33s) │ ♟️ Stockfish-PVS: 401/416 (96.39% acc, mean len 6.90)</text>
