<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161d2b"/>
      <stop offset="100%" stop-color="#121722"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
      .reveal1 { opacity: 0; animation: fadeIn 0.4s 0.4s forwards; }
      .reveal2 { opacity: 0; animation: fadeIn 0.4s 1.2s forwards; }
      .reveal3 { opacity: 0; animation: fadeIn 0.4s 2.2s forwards; }
      .reveal4 { opacity: 0; animation: fadeIn 0.5s 3.2s forwards; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect width="980" height="540" rx="12" fill="url(#bgGrad)" stroke="#263248" stroke-width="1.5"/>

  <!-- Window Title Bar -->
  <rect width="980" height="38" rx="12" fill="#151b26"/>
  <rect y="26" width="980" height="12" fill="#151b26"/>
  <line x1="0" y1="38" x2="980" y2="38" stroke="#263248" stroke-width="1"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="84" y="24" fill="#e6edf3" font-size="13" font-weight="700" class="mono">♟️ llama-modchip v2.1 — 256K CPU Co-Design + Stockfish-PVS (M=7) Telemetry HUD</text>
  <rect x="838" y="9" width="124" height="20" rx="10" fill="#122d1f" stroke="#2ea043" stroke-width="1"/>
  <circle cx="850" cy="19" r="4" fill="#3fb950" class="pulse"/>
  <text x="860" y="23" fill="#3fb950" font-size="11" font-weight="700" class="mono">0 GPU • ONLINE</text>

  <!-- Top HUD Cards (5 Columns) -->
  <!-- Card 1: Decode Speed -->
  <g transform="translate(16, 50)">
    <rect width="182" height="68" rx="8" fill="url(#cardGrad)" stroke="#263248"/>
    <text x="12" y="19" fill="#8b949e" font-size="10" font-weight="600" class="mono">⚡ DECODE SPEED (CPU)</text>
    <text x="12" y="42" fill="#3fb950" font-size="20" font-weight="700" class="mono">48.39 tok/s</text>
    <text x="12" y="58" fill="#58a6ff" font-size="11" class="mono">Peak burst: 60.40 tok/s</text>
  </g>

  <!-- Card 2: Stockfish-PVS M=7 -->
  <g transform="translate(207, 50)">
    <rect width="194" height="68" rx="8" fill="url(#cardGrad)" stroke="#263248"/>
    <text x="12" y="19" fill="#8b949e" font-size="10" font-weight="600" class="mono">♟️ STOCKFISH-PVS (M=7)</text>
    <text x="12" y="42" fill="#bc8cff" font-size="20" font-weight="700" class="mono">96.4% Accept</text>
    <text x="12" y="58" fill="#8b949e" font-size="11" class="mono">Mean len: 6.90 tok/step</text>
  </g>

  <!-- Card 3: TTFT & Slot 0 Restore -->
