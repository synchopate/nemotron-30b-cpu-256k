    <rect width="182" height="68" rx="8" fill="url(#cardGrad)" stroke="#263248"/>
    <text x="12" y="19" fill="#8b949e" font-size="10" font-weight="600" class="mono">💾 256K KV + MAMBA-2</text>
    <text x="12" y="42" fill="#d29922" font-size="20" font-weight="700" class="mono">432 MB @ 256K</text>
    <text x="12" y="58" fill="#8b949e" font-size="11" class="mono">-94% RAM vs 7.1GB GQA</text>
  </g>

  <!-- Card 5: Modchip Safety Locks -->
  <g transform="translate(792, 50)">
    <rect width="172" height="68" rx="8" fill="url(#cardGrad)" stroke="#263248"/>
    <text x="12" y="19" fill="#8b949e" font-size="10" font-weight="600" class="mono">🔧 MODCHIP LOCKS</text>
    <text x="12" y="42" fill="#3fb950" font-size="18" font-weight="700" class="mono">MoE Top-K: 6→4</text>
    <text x="12" y="58" fill="#8b949e" font-size="11" class="mono">2MB THP: 19.04 GiB</text>
  </g>

  <!-- Terminal Body -->
  <rect x="16" y="130" width="948" height="394" rx="8" fill="#090c12" stroke="#222c40"/>

  <!-- Prompt Line 1 -->
  <text x="32" y="158" fill="#3fb950" font-size="13" font-weight="700" class="mono">paolo@zen5-9955hx:~/nemotron-30b-cpu-256k$</text>
  <text x="382" y="158" fill="#e6edf3" font-size="13" font-weight="700" class="mono">./modchip bench</text>

  <!-- Stage 1 Output -->
