    <rect x="32" y="330" width="916" height="148" rx="6" fill="#0f1722" stroke="#2ea043" stroke-width="1.2"/>
    <text x="48" y="353" fill="#3fb950" font-size="13" font-weight="700" class="mono">🚀 LLAMA-MODCHIP v2.1 BENCHMARK SCORECARD — AMD Ryzen 9 9955HX (16C/32T Zen 5 • 0 GPUs • 64GB DDR5)</text>
    <line x1="48" y1="363" x2="932" y2="363" stroke="#233146" stroke-width="1"/>
    <text x="48" y="384" fill="#e6edf3" font-size="12.5" class="mono">• Model &amp; Context      : NVIDIA-Nemotron-3.5-30B-A3B-Q4_0 (23 Mamba-2 + 23 MoE + 6 GQA) @ 262,144 Tokens (256K)</text>
    <text x="48" y="404" fill="#e6edf3" font-size="12.5" class="mono">• Cold Prompt Prefill  : 241.0 tok/s (Peak: 306.8 tok/s @ -b 2048) │ Warm 22.2K Slot 0 Restore: 18.9 ms</text>
    <text x="48" y="424" fill="#e6edf3" font-size="12.5" class="mono">• Decode (Mixed/Audit) : 28.61 tok/s avg / 48.47 tok/s peak (86.1% acc) │ Prose Audit: 85.0% draft acceptance</text>
    <text x="48" y="444" fill="#3fb950" font-size="12.5" font-weight="700" class="mono">• Decode (M=7 Burst)   : 48.39 tok/s avg / 60.40 tok/s peak (96.4% Stockfish-PVS acc, 6.90 tokens/step!)</text>
    <text x="48" y="466" fill="#58a6ff" font-size="11.5" class="mono">👉 Run './modchip chat' or open http://127.0.0.1:8787 for Live Web Chat &amp; Telemetry HUD</text>
  </g>

  <!-- Bottom Prompt -->
  <g class="reveal4">
    <text x="32" y="504" fill="#3fb950" font-size="13" font-weight="700" class="mono">paolo@zen5-9955hx:~/nemotron-30b-cpu-256k$</text>
    <text x="382" y="504" fill="#e6edf3" font-size="13" font-weight="700" class="mono">./modchip chat</text>
    <rect x="498" y="491" width="9" height="16" fill="#3fb950" class="pulse"/>
  </g>
</svg>
