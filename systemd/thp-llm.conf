# Enable 2MB Transparent HugePages for madvise(MADV_HUGEPAGE) regions used by llama-modchip
# (Use 'madvise' so only processes requesting MADV_HUGEPAGE get 2MB pages without affecting unrelated host tasks)
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
